<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f121a" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(204,255,0,0.3)" stroke-width="8" />
  <!-- Hexagonal Tech Ring -->
  <polygon points="256,60 416,152 416,336 256,428 96,336 96,152" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6" />
  <!-- Central Stylized K -->
  <path d="M 170 120 L 220 120 L 220 392 L 170 392 Z" fill="url(#neonLime)" filter="url(#glow)" />
  <path d="M 220 256 L 310 120 L 375 120 L 265 275 L 385 392 L 320 392 L 220 275 Z" fill="url(#neonLime)" filter="url(#glow)" />
  <circle cx="256" cy="460" r="8" fill="#ccff00" />
</svg>
